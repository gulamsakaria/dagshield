# One-time helper: rewrites the author of the github-actions[bot] commit to the repository owner
# (the files stay exactly the same), then force-updates main. Delete this file afterwards.
name: rewrite-history
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rewrite.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite bot commit author and update main
        run: |
          set -euo pipefail
          BOT="41898282+github-actions[bot]@users.noreply.github.com"
          ME_NAME="Gulam Sakaria"
          ME_EMAIL="109577577+gulamsakaria@users.noreply.github.com"
          git config user.name "$ME_NAME"
          git config user.email "$ME_EMAIL"
          OLD=$(git rev-parse HEAD)
          git checkout -q -b rewritten
          export BOT ME_NAME ME_EMAIL
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
            if [ "$GIT_AUTHOR_EMAIL" = "$BOT" ]; then
              export GIT_AUTHOR_NAME="$ME_NAME"; export GIT_AUTHOR_EMAIL="$ME_EMAIL"
            fi
            if [ "$GIT_COMMITTER_EMAIL" = "$BOT" ]; then
              export GIT_COMMITTER_NAME="$ME_NAME"; export GIT_COMMITTER_EMAIL="$ME_EMAIL"
            fi
          ' -- rewritten
          NEW=$(git rev-parse rewritten)
          test "$(git rev-parse "$NEW^{tree}")" = "$(git rev-parse "$OLD^{tree}")"
          test "$(git rev-list --count "$NEW")" = "$(git rev-list --count "$OLD")"
          git log --format='%h %an <%ae> | %s'
          if git log --format='%ae %ce' | grep -qi "github-actions"; then echo "bot still present"; exit 1; fi
          git push --force-with-lease=main:"$OLD" origin rewritten:main
